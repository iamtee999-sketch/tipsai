  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body data-page="post">
  <!-- Thanh tiến trình đọc bài (Reading Progress Bar) -->
  <div class="reading-progress-bar" id="readingProgressBar"></div>

  <div class="ambient-aurora" aria-hidden="true">
    <div class="aurora-blob aurora-blob-1"></div>
    <div class="aurora-blob aurora-blob-2"></div>
  </div>

  <header class="navbar" id="siteNavbar"></header>

  <main>
    <section class="section-block" style="padding-top: 28px;">
      <div class="container" id="singlePostContainer">
        <!-- Rendered dynamically by app.js based on ?id=... or ?slug=... -->
      </div>
      <div class="container" id="postCommentsSection">
        <!-- Interactive Article Comments & Community Hub rendered by app.js -->
      </div>
    </section>

    <section class="section-block">
      <div class="container">
        <div class="section-header">
          <div>
            <h2 class="section-title">📚 Bài viết mới nhất</h2>
            <p class="section-desc">Cập nhật những bài viết và hướng dẫn AI mới nhất vừa được xuất bản trên TipsAI.</p>
          </div>
          <a href="blog.html" class="btn btn-secondary btn-sm">Xem toàn bộ Blog →</a>
        </div>
        <div class="cards-grid-3" id="relatedPostsGrid">
          <!-- Rendered by app.js -->
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
