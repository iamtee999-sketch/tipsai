<body data-page="tips">
  <div class="ambient-aurora" aria-hidden="true">
    <div class="aurora-blob aurora-blob-1"></div>
    <div class="aurora-blob aurora-blob-2"></div>
  </div>

  <header class="navbar" id="siteNavbar"></header>

  <main>
    <section class="page-banner">
      <div class="container">
        <div class="page-banner-shell">
          <div>
            <span class="badge badge-purple" style="margin-bottom: 10px;">💡 CHUYÊN TRANG MẸO & THỦ THUẬT AI</span>
            <h1 style="font-family: var(--font-display); font-size: 34px; font-weight: 800; line-height: 1.2;">
              Kho Mẹo & Thủ Thuật AI Thực Chiến
            </h1>
            <p style="color: var(--text-secondary); font-size: 15.5px; margin-top: 6px; max-width: 720px;">
              Mỗi thủ thuật đều đi kèm ví dụ đối chiếu <strong>Trước / Sau (Before vs. After)</strong> để bạn sao chép và áp dụng ngay lập tức.
            </p>
          </div>
          <a href="prompts.html" class="btn btn-secondary">
            <span>⚡ Mở Kho Prompt Động →</span>
          </a>
        </div>
      </div>
    </section>

    <section class="section-block">
      <div class="container">
        <div class="filter-toolbar">
          <div class="pill-tabs" id="tipCategoryTabs" role="tablist">
            <!-- Rendered by app.js -->
          </div>

          <div class="filter-search-group">
            <input
              type="search"
              id="tipSearchInput"
              class="input-field"
              placeholder="Tìm mẹo (VD: C.R.A.F.T, debug, PDF...)"
              aria-label="Tìm kiếm mẹo AI"
            />
            <select id="tipDifficultySelect" class="select-field" aria-label="Lọc theo cấp độ">
              <option value="all">Mọi cấp độ</option>
              <option value="Cơ bản">🟢 Cơ bản</option>
              <option value="Trung cấp">🟡 Trung cấp</option>
              <option value="Chuyên sâu">🟣 Chuyên sâu</option>
            </select>
            <select id="tipSortSelect" class="select-field" aria-label="Sắp xếp mẹo">
              <option value="popular">🔥 Nhiều bình chọn nhất</option>
              <option value="quick">⚡ Đọc nhanh nhất</option>
            </select>
          </div>
        </div>

        <div class="cards-grid-3" id="tipsGrid">
          <!-- Rendered by app.js -->
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
