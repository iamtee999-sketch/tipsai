<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danh Bạ Công Cụ AI Chọn Lọc (AI Tools) — TipsAI</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="description" content="Danh bạ các công cụ AI tốt nhất cho viết lách, lập trình, thiết kế ảnh, video và nghiên cứu kèm Bảng xếp hạng AI theo nhu cầu thực tế." />
  <link rel="canonical" href="https://iamtee999-sketch.github.io/tipsai/tools.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TipsAI (iTee360)" />
  <meta property="og:title" content="Danh Bạ AI Tools & Bảng Xếp Hạng AI Thực Chiến — TipsAI" />
  <meta property="og:description" content="Dùng AI nào cho việc gì? Bảng xếp hạng công cụ AI số 1 cho từng tác vụ thực tế kèm mẹo ẩn chuyên gia." />
  <meta property="og:url" content="https://iamtee999-sketch.github.io/tipsai/tools.html" />
  <meta property="og:image" content="https://iamtee999-sketch.github.io/tipsai/assets/covers/og-banner.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="tools">
  <div class="ambient-aurora" aria-hidden="true">
    <div class="aurora-blob aurora-blob-1"></div>
    <div class="aurora-blob aurora-blob-2"></div>
  </div>

  <header class="navbar" id="siteNavbar"></header>

  <main>
    <section class="page-banner">
      <div class="container">
        <div class="page-banner-shell">
          <div>
            <span class="badge badge-cyan" style="margin-bottom: 10px;">🧰 CHUYÊN TRANG DANH BẠ AI TOOLS</span>
            <h1 style="font-family: var(--font-display); font-size: 34px; font-weight: 800; line-height: 1.2;">
              Danh Bạ Công Cụ AI Đỉnh Nhất & Mẹo Ẩn
            </h1>
            <p style="color: var(--text-secondary); font-size: 15.5px; margin-top: 6px; max-width: 720px;">
              Đánh giá khách quan ưu/nhược điểm và bật mí 1 mẹo ẩn cho từng công cụ. Bạn có thể đánh dấu chọn tối đa <strong>3 công cụ</strong> để mở bảng đối chiếu trực tiếp.
            </p>
          </div>
          <a href="blog.html" class="btn btn-secondary">
            <span>📰 Đọc bài Review AI Tools →</span>
          </a>
        </div>
      </div>
    </section>

    <section class="section-block">
      <div class="container">
        <!-- Bảng Xếp Hạng AI Theo Nhu Cầu Thực Tế (Dùng AI nào cho việc gì?) -->
        <div id="aiLeaderboardSection"></div>

        <div class="filter-toolbar">
          <div class="pill-tabs" id="toolCategoryTabs" role="tablist">
            <!-- Rendered by app.js -->
          </div>
          <div class="filter-search-group">
            <select id="toolPricingSelect" class="select-field" aria-label="Lọc theo chi phí">
              <option value="all">Mọi mức giá</option>
              <option value="Miễn phí">🟢 100% Miễn phí</option>
              <option value="Freemium">🔵 Có bản Miễn phí (Freemium)</option>
              <option value="Trả phí">🟣 Trả phí chuyên nghiệp</option>
            </select>
            <input
              type="search"
              id="toolSearchInput"
              class="input-field"
              placeholder="Tìm công cụ AI..."
              aria-label="Tìm công cụ AI"
            />
          </div>
        </div>

        <div class="cards-grid-3" id="toolsGrid">
          <!-- Rendered by app.js -->
        </div>
      </div>
    </section>
  </main>

  <!-- Thanh nổi So sánh AI Tools -->
  <div class="compare-floating-bar" id="compareFloatingBar" hidden>
    <div>
      <strong style="color: var(--text-primary);">⚖️ Đang chọn so sánh: </strong>
      <span id="compareCountText" style="color: var(--accent-cyan); font-weight: 600;">0/3 công cụ</span>
    </div>
    <div style="display: flex; gap: 10px;">
      <button type="button" class="btn btn-primary btn-sm" id="openCompareModalBtn">So sánh ngay</button>
      <button type="button" class="btn btn-ghost btn-sm" id="clearCompareBtn">Xóa chọn</button>
    </div>
  </div>

  <footer class="site-footer" id="siteFooter"></footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
